[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-smi-exporter"
version = "2.5.0"
description = "Prometheus exporter for AMD GPUs via rocm-smi"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "prometheus_client==0.25.0",
]

[project.scripts]
rocm-smi-exporter = "rocm_smi_exporter.main:main"

[tool.setuptools.packages.find]
include = ["rocm_smi_exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring Docker (deselect with '-m \"not integration\"')",
]
addopts = "-m \"not integration\""
