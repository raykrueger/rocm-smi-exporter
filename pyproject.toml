[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-smi-exporter"
version = "2.4.2"
description = "Prometheus exporter for AMD GPUs via rocm-smi"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "prometheus_client==0.25.0",
]

[project.scripts]
rocm-smi-exporter = "main:main"

[tool.setuptools]
py-modules = ["main"]
